name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy

      - name: Verify tag matches crate version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must have the form vX.Y.Z; got ${TAG}" >&2
            exit 1
          fi

          crate_version="$(
            cargo metadata --locked --no-deps --format-version 1 |
              jq -r --arg manifest "${GITHUB_WORKSPACE}/Cargo.toml" \
                '.packages[] | select(.manifest_path == $manifest) | .version'
          )"
          if [[ -z "${crate_version}" ]]; then
            echo "Could not determine the root crate version" >&2
            exit 1
          fi
          if [[ "${TAG}" != "v${crate_version}" ]]; then
            echo "Release tag ${TAG} does not match Cargo.toml version ${crate_version}" >&2
            exit 1
          fi

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --locked

      - name: Verify package
        run: cargo package --locked

      - name: Install cargo-audit
        uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2
        with:
          tool: cargo-audit@0.22.2
          fallback: none

      - name: Audit dependencies
        run: cargo audit --deny warnings

      - name: Install Rust 1.88.0
        uses: dtolnay/rust-toolchain@39b0b3842c7e8bbf6904c0bfc3d9006fdd4dc4e0 # 1.88.0

      - name: Check MSRV
        run: cargo +1.88.0 check --all-targets --locked

  create-release:
    name: Create GitHub Release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: taiki-e/create-gh-release-action@eba8ea96c86cca8a37f1b56e94b4d13301fba651 # v1
        with:
          changelog: CHANGELOG.md
          draft: true
          branch: master
          token: ${{ secrets.GITHUB_TOKEN }}

  upload-binaries:
    name: Build ${{ matrix.target }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1
        with:
          bin: dlt-tui
          target: ${{ matrix.target }}
          tar: unix
          zip: windows
          locked: true
          token: ${{ secrets.GITHUB_TOKEN }}

  publish-release:
    name: Publish complete GitHub Release
    needs: upload-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Verify assets and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          expected_assets=(
            dlt-tui-x86_64-unknown-linux-gnu.tar.gz
            dlt-tui-x86_64-unknown-linux-musl.tar.gz
            dlt-tui-aarch64-unknown-linux-musl.tar.gz
            dlt-tui-x86_64-apple-darwin.tar.gz
            dlt-tui-aarch64-apple-darwin.tar.gz
            dlt-tui-x86_64-pc-windows-msvc.zip
          )

          release_json="$(gh release view "${TAG}" --json isDraft,assets)"
          if [[ "$(jq -r '.isDraft' <<<"${release_json}")" != "true" ]]; then
            echo "Release ${TAG} must remain a draft until every asset is verified" >&2
            exit 1
          fi

          actual_count="$(jq '.assets | length' <<<"${release_json}")"
          if [[ "${actual_count}" -ne "${#expected_assets[@]}" ]]; then
            echo "Release ${TAG} has ${actual_count} assets; expected ${#expected_assets[@]}" >&2
            jq -r '.assets[].name' <<<"${release_json}" >&2
            exit 1
          fi

          for asset in "${expected_assets[@]}"; do
            asset_record="$(
              jq -r --arg name "${asset}" \
                '.assets[] | select(.name == $name) | [.state, .size] | @tsv' \
                <<<"${release_json}"
            )"
            if [[ -z "${asset_record}" ]]; then
              echo "Release ${TAG} is missing required asset: ${asset}" >&2
              exit 1
            fi
            IFS=$'\t' read -r asset_state asset_size <<<"${asset_record}"
            if [[ "${asset_state}" != "uploaded" || ! "${asset_size}" =~ ^[1-9][0-9]*$ ]]; then
              echo "Release asset ${asset} is not a non-empty completed upload" >&2
              exit 1
            fi
          done

          gh release edit "${TAG}" --draft=false --latest

  update-tap:
    name: Update Homebrew tap
    needs: publish-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tkmsikd/homebrew-tap
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: tkmsikd/homebrew-tap
          token: ${{ secrets.TAP_GITHUB_TOKEN }}

      - name: Compute version from tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Download release archives and compute checksums
        id: sha
        env:
          TAG: ${{ github.ref_name }}
          BASE_URL: https://github.com/tkmsikd/dlt-tui/releases/download
        run: |
          set -euo pipefail
          for target in aarch64-apple-darwin x86_64-apple-darwin aarch64-unknown-linux-musl x86_64-unknown-linux-musl; do
            asset="dlt-tui-${target}.tar.gz"
            url="${BASE_URL}/${TAG}/${asset}"
            echo "Downloading ${url}"
            curl -fSL --retry 3 -o "${asset}" "${url}"
            sha="$(sha256sum "${asset}" | cut -d' ' -f1)"
            echo "${target//-/_}=${sha}" >> "$GITHUB_OUTPUT"
          done

      - name: Regenerate Formula/dlt-tui.rb
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA_AARCH64_APPLE_DARWIN: ${{ steps.sha.outputs.aarch64_apple_darwin }}
          SHA_X86_64_APPLE_DARWIN: ${{ steps.sha.outputs.x86_64_apple_darwin }}
          SHA_AARCH64_LINUX_MUSL: ${{ steps.sha.outputs.aarch64_unknown_linux_musl }}
          SHA_X86_64_LINUX_MUSL: ${{ steps.sha.outputs.x86_64_unknown_linux_musl }}
        run: |
          cat > Formula/dlt-tui.rb <<EOF
          class DltTui < Formula
            desc "Fast, keyboard-centric TUI viewer for Automotive DLT files"
            homepage "https://github.com/tkmsikd/dlt-tui"
            version "${VERSION}"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/tkmsikd/dlt-tui/releases/download/v${VERSION}/dlt-tui-aarch64-apple-darwin.tar.gz"
                sha256 "${SHA_AARCH64_APPLE_DARWIN}"
              else
                url "https://github.com/tkmsikd/dlt-tui/releases/download/v${VERSION}/dlt-tui-x86_64-apple-darwin.tar.gz"
                sha256 "${SHA_X86_64_APPLE_DARWIN}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "https://github.com/tkmsikd/dlt-tui/releases/download/v${VERSION}/dlt-tui-aarch64-unknown-linux-musl.tar.gz"
                sha256 "${SHA_AARCH64_LINUX_MUSL}"
              else
                url "https://github.com/tkmsikd/dlt-tui/releases/download/v${VERSION}/dlt-tui-x86_64-unknown-linux-musl.tar.gz"
                sha256 "${SHA_X86_64_LINUX_MUSL}"
              end
            end

            def install
              bin.install "dlt-tui"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/dlt-tui --version")
            end
          end
          EOF

      - name: Commit and push
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/dlt-tui.rb
          if git diff --cached --quiet; then
            echo "No changes to formula; nothing to commit"
            exit 0
          fi
          git commit -m "dlt-tui ${VERSION}"
          git push origin main
